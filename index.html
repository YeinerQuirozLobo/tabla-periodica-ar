<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla periodica en Realidad Aumentada</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene embedded arjs="debugUIEnabled: false;">
    
    <!-- Marcador personalizado: Hidrógeno -->
    <a-marker type="pattern" url="markers/hidrogeno.patt">
      <!-- Imagen que aparecerá al detectar el marcador -->
      <a-plane src="images/hidrogeno.jpg" 
               width="1" 
               height="1" 
               position="0 0 0" 
               rotation="-90 0 0">
      </a-plane>
    </a-marker>

<!-- Marcador personalizado: Helio -->
    <a-marker type="pattern" url="markers/helio.patt">
      <!-- Imagen que aparecerá al detectar el marcador -->
      <a-plane src="images/helio.jpg" 
               width="1" 
               height="1" 
               position="0 0 0" 
               rotation="-90 0 0">
      </a-plane>
    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>

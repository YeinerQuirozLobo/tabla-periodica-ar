<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica AR - Corregido</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <a-scene 
        embedded 
        arjs="
            sourceType: webcam; 
            debugUIEnabled: true;
            detectionMode: mono;
            matrixCodeType: 3x3;
            maxDetectionRate: 30;
            canvasWidth: 640;
            canvasHeight: 480;
        "
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false"
    >
        <!-- PLATA - CONFIGURACIÓN CORREGIDA -->
        <a-marker 
            type="pattern" 
            url="markers/plata.patt"
            size="0.16"
            preset="custom"
            emitevents="true"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >
            <a-image
                src="https://placehold.co/400x400/003366/white/png?text=PLATA"
                width="0.8"
                height="0.8"
                position="0 0 0"
                rotation="0 0 0"
                visible="true"
            ></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
    // Debug mejorado
    console.log("🟢 Configuración optimizada para marcadores");
    
    const marker = document.querySelector('a-marker');
    
    marker.addEventListener('markerFound', function() {
        console.log("🎯 ¡MARCador DETECTADO!");
        document.body.style.backgroundColor = "#00ff00"; // Verde cuando detecta
    });
    
    marker.addEventListener('markerLost', function() {
        console.log("👋 Marcador perdido");
        document.body.style.backgroundColor = "";
    });
    </script>
</body>
</html>

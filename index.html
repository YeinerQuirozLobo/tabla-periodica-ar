<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica AR - Corregido</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <a-scene 
    embedded 
    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
        detectionMode: mono;
        matrixCodeType: 3x3;
        maxDetectionRate: 60;
    "
>
    <a-marker 
        type="pattern" 
        url="markers/plata.patt"
        emitevents="true"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"
    >
        <!-- La escala se ajusta automáticamente -->
        <a-image
            src="images/plata.jpg"
        ></a-image>
    </a-marker>
</a-scene>

    <script>
    // Debug mejorado
    console.log("🟢 Configuración optimizada para marcadores");
    
    const marker = document.querySelector('a-marker');
    
    marker.addEventListener('markerFound', function() {
        console.log("🎯 ¡MARCador DETECTADO!");
        document.body.style.backgroundColor = "#00ff00"; // Verde cuando detecta
    });
    
    marker.addEventListener('markerLost', function() {
        console.log("👋 Marcador perdido");
        document.body.style.backgroundColor = "";
    });
    </script>
</body>
</html>

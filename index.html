<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug AR - Marcadores</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="debug" id="debug">Estado: Iniciando...</div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: true;"
        vr-mode-ui="enabled: false"
    >
        <!-- MARCador DE PRUEBA con CUBO ROJO -->
        <a-marker 
            type="pattern" 
            url="markers/plata.patt"
            id="marker-plata"
            emitevents="true"
            size="0.5"
        >
            <!-- CUBO ROJO para verificar detección -->
            <a-box 
                color="red" 
                position="0 0.5 0" 
                scale="0.3 0.3 0.3"
                visible="true"
            ></a-box>
            
            <!-- Imagen de internet -->
            <a-image
                src="https://placehold.co/400x400/ff0000/white/png?text=PLATA"
                width="1.0"
                height="1.0"
                position="0 0 0"
                rotation="0 0 0"
                visible="true"
            ></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
    // DEBUG COMPLETO
    const debug = document.getElementById('debug');
    const scene = document.querySelector('a-scene');
    const marker = document.querySelector('a-marker');
    
    console.log("🎯 Marcador:", marker);
    console.log("🔗 URL del marcador:", marker?.getAttribute('url'));
    
    // Eventos de debug
    scene.addEventListener('loaded', function() {
        debug.textContent += "\n✅ Escena cargada";
        console.log("✅ Escena AR cargada");
    });
    
    // Eventos del marcador
    marker.addEventListener('markerFound', function() {
        debug.textContent += "\n🎯 Marcador DETECTADO";
        console.log("🎯 Marcador detectado!");
    });
    
    marker.addEventListener('markerLost', function() {
        debug.textContent += "\n👋 Marcador PERDIDO";
    });
    
    // Verificar recursos
    window.addEventListener('load', function() {
        // Verificar si el marcador .patt existe
        fetch(marker.getAttribute('url'))
            .then(response => {
                if (response.ok) {
                    debug.textContent += "\n✅ Marcador .patt EXISTE";
                    console.log("✅ Archivo .patt existe");
                } else {
                    debug.textContent += "\n❌ Marcador .patt NO EXISTE";
                    console.error("❌ Archivo .patt no encontrado");
                }
            })
            .catch(error => {
                debug.textContent += "\n❌ Error cargando marcador";
                console.error("❌ Error fetch:", error);
            });
    });
    
    // Estado de la cámara
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(() => {
            debug.textContent += "\n✅ Cámara ACTIVADA";
        })
        .catch(error => {
            debug.textContent += "\n❌ Error cámara: " + error.message;
        });
    </script>
</body>
</html>

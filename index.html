<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla Periódica AR Móvil</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: black;
      background: rgba(255,255,255,0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">🔍 Buscando marcadores...</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    
    <!-- Plata -->
    <a-marker type="pattern" url="markers/plata.patt" id="plataMarker">
      <a-plane src="https://placehold.co/600x600/003366/white/png?text=PLATA"
         width="1.5" height="1.5"
         position="0 0 0"
         rotation="-90 0 0"></a-plane>
    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    console.log("🟢 Iniciando AR móvil");
    const loading = document.getElementById('loading');

    // Verificar imagen
    const testImage = new Image();
    testImage.onload = function() {
      console.log("✅ Imagen plata.jpg cargada correctamente");
      loading.textContent = "✅ Imagen cargada - Apunta al marcador";
    };
    testImage.onerror = function() {
      console.error("❌ ERROR: Imagen plata.jpg no encontrada");
      loading.innerHTML = "❌ Error: imagen no encontrada<br>Verifica: images/plata.jpg";
    };
    testImage.src = "images/plata.jpg";

    // Cuando la escena AR cargue
    document.querySelector('a-scene').addEventListener('loaded', () => {
      console.log("🎬 Escena AR cargada");
      loading.style.display = 'none';
    });

    // Detectar marcador individual
    const plataMarker = document.getElementById('plataMarker');
    plataMarker.addEventListener('markerFound', () => {
      console.log("🎯 Marcador PLATA detectado");
    });
    plataMarker.addEventListener('markerLost', () => {
      console.log("⚠️ Marcador PLATA perdido");
    });
  </script>
</body>
</html>
